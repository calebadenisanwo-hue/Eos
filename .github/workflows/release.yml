name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradle Wrapper
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Build APK with Gradle
        run: |
          # Build debug APK (pre-signed for immediate installation on any Android device)
          if [ -f "./gradlew" ]; then
            ./gradlew :app:assembleDebug --stacktrace
          else
            gradle :app:assembleDebug --stacktrace
          fi

      - name: Locate and Rename APK
        run: |
          mkdir -p release-artifacts
          TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          fi
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="v1.0.0"
          fi
          
          # Find generated APK
          APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -f "$APK_FILE" ]; then
            cp "$APK_FILE" "release-artifacts/eos-${TAG}.apk"
            echo "Artifact prepared at release-artifacts/eos-${TAG}.apk"
          else
            echo "Error: No APK found!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: eos-apk
          path: release-artifacts/*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name != 'main' && github.ref_name || github.event.inputs.tag_name || 'v1.0.0' }}
          name: Eos ${{ github.ref_name != 'main' && github.ref_name || github.event.inputs.tag_name || 'v1.0.0' }}
          draft: false
          prerelease: false
          body: |
            ## Eos — Private Companion for Long-Distance Couples 🌅
            
            Welcome to **Eos**, the calm, beautiful Android app built specifically for long-distance couples, grounded in the sky between you.
            
            ### Included in this Release:
            - **Two Windows Dynamic Sky**: Real-time daylight/twilight solar simulation for Gothenburg & Pune.
            - **Quiet Reactions & Presence**: "Around", "Heads down", "Sleeping", and "In transit" with zero-guilt responses.
            - **80 Calibrated Questions**: Across 4 decks (*Daily, Deep, Playful, Future*) with mutual reveal-together privacy.
            - **End-to-End Encryption**: AES-GCM-256 envelope encryption with secondary PBKDF2 Vault Key wrapping.
            - **Pause & Repair**: 20-minute guided breathing cooldown, 4 grounding prompts, and Park It scheduler.
            - **Our Story & Visits Log**: 312 cumulative connection days, 20+ wry/tender moments, and travel passes.
            - **Private Mode (18+)**: 6-digit PIN lock, Quick-Hide button, heartbeat taps, 40 flirt prompts, 20 spicy questions, and auto-destructing view-once photos.
            - **Press Play Together**: Synced 3-2-1 countdown and mid-movie sync checker.
            - **Close the Distance Roadmap**: 4-stage relocation planner, relocation savings fund, split packing list, and pinned "Why".
            - **Offline-First & Data Export**: Visual outbox with instant retry and one-tap complete JSON/HTML keepsake export.
            
            ### Installation:
            Download and install `eos-${{ github.ref_name != 'main' && github.ref_name || github.event.inputs.tag_name || 'v1.0.0' }}.apk` on your Android device (enable "Install unknown apps" if prompted).
          files: release-artifacts/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
